<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rivalry Week Look: Picks</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/tokens.css">
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/components/bundle.css">
<script src="ds/saturdayslatedesignsystem/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--foreground)}a:hover{color:var(--primary)}
</style>
</helmet>
<div style="width: 1560px; height: 868px; box-sizing: border-box; padding: 0 0 8px; display: flex; gap: 40px; background: #e9e4da; font-family: var(--font-sans);">
  <sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
    <div style="width: 360px; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 64px; box-sizing: border-box; padding-top: 8px;">
        <div style="font: 700 16px/22px var(--font-sans); color: #241f1a;">{{p.label}}</div>
        <div style="font: 400 13px/18px var(--font-sans); color: #5c5246;">{{p.sub}}</div>
      </div>
      <div style="{{p.rootStyle}}">
        <sc-if value="{{p.laces}}" hint-placeholder-val="{{false}}">
          <svg width="360" height="10" viewBox="0 0 360 10" aria-hidden="true" style="display: block; flex-shrink: 0;"><rect width="360" height="10" style="fill: var(--primary);"></rect><g style="stroke: var(--primary-foreground);" stroke-width="1.5" stroke-linecap="round"><line x1="148" y1="5" x2="212" y2="5"></line><line x1="156" y1="2" x2="156" y2="8"></line><line x1="164" y1="2" x2="164" y2="8"></line><line x1="172" y1="2" x2="172" y2="8"></line><line x1="180" y1="2" x2="180" y2="8"></line><line x1="188" y1="2" x2="188" y2="8"></line><line x1="196" y1="2" x2="196" y2="8"></line><line x1="204" y1="2" x2="204" y2="8"></line></g></svg>
        </sc-if>
        <x-import component-from-global-scope="SaturdaySlateDesignSystem.AppHeader" title="Week 13" sub="Game 2 of 12" right="{{p.menu}}"></x-import>
        <sc-if value="{{p.band}}" hint-placeholder-val="{{false}}">
          <div style="flex-shrink: 0; height: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--secondary); color: var(--secondary-foreground); font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;">
            <span aria-hidden="true" style="width: 24px; height: 1px; background: currentColor;"></span>
            <span>Rivalry Week</span>
            <span aria-hidden="true" style="width: 24px; height: 1px; background: currentColor;"></span>
          </div>
        </sc-if>

        <nav aria-label="Games" style="display: flex; align-items: center; gap: 4px; padding: 0 16px;">
          <sc-for list="{{p.segs}}" as="s" hint-placeholder-count="12">
            <span style="flex: 1; padding: 18px 0;"><span style="{{s.style}}"></span></span>
          </sc-for>
          <span style="width: 26px; display: grid; place-items: center;"><span style="width: 22px; height: 22px; box-sizing: border-box; border: 2px dashed var(--secondary); border-radius: 999px;"></span></span>
          <span style="width: 26px; display: grid; place-items: center;"><span style="width: 22px; height: 22px; box-sizing: border-box; border: 2px dashed var(--secondary); border-radius: 999px;"></span></span>
        </nav>

        <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 12px;">
          <sc-if value="{{p.isA}}" hint-placeholder-val="{{false}}">
            <div style="font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary);">Iron Bowl</div>
          </sc-if>
          <div style="display: flex; min-height: 24px; align-items: center; gap: 8px;">
            <span style="display: grid; flex: 1; min-width: 0; font-size: 14px; line-height: 18px; color: var(--muted-foreground);">
              <span>Sat 2:30 PM · CBS</span>
              <span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Bryant-Denny Stadium · Tuscaloosa, AL</span>
            </span>
            <sc-if value="{{p.isB}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; box-sizing: border-box; border: 1px solid var(--secondary); border-radius: 999px; color: var(--secondary); font: 700 12px/16px var(--font-sans); white-space: nowrap;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline><line x1="13" x2="19" y1="19" y2="13"></line><line x1="16" x2="20" y1="16" y2="20"></line><line x1="19" x2="21" y1="21" y2="19"></line><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline><line x1="5" x2="9" y1="14" y2="18"></line><line x1="7" x2="4" y1="17" y2="20"></line><line x1="3" x2="5" y1="19" y2="21"></line></svg>
                Iron Bowl
              </span>
            </sc-if>
          </div>
          <sc-if value="{{p.isC}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0 4px; border-top: 3px double var(--secondary); border-bottom: 3px double var(--secondary);">
              <div style="font: 900 26px/32px var(--font-display); color: var(--foreground);">Iron Bowl</div>
            </div>
          </sc-if>

          <div style="display: grid; gap: 8px; padding: 6px 4px 10px;">
            <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; column-gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums;">
              <span style="font-weight: 500; color: var(--muted-foreground);">+6.5</span>
              <span style="text-align: center; font: 700 10px/12px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary);">Spread</span>
              <span style="text-align: right; font-weight: 800;">-6.5</span>
            </div>
            <div style="display: grid; gap: 4px;">
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--muted-foreground);">
                <b style="color: var(--foreground);">31%</b>
                <span style="font: 700 11px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary);">Win probability</span>
                <b style="color: var(--foreground);">69%</b>
              </div>
              <span role="img" aria-label="Auburn 31%, Alabama 69%" style="display: flex; gap: 3px; height: 8px; overflow: hidden; border-radius: 999px; background: var(--border);">
                <span style="width: 31%; background: #0C2340;"></span>
                <span style="flex: 1; background: #9E1B32;"></span>
              </span>
            </div>
          </div>

          <div style="flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 6px;">
            <button type="button" aria-pressed="false" style="position: relative; flex: 1; min-width: 0; min-height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; box-sizing: border-box; padding: 12px 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--muted-foreground); cursor: pointer;">
              <img src="/_blob/242777eb3717bb01d75a75b424a42395" alt="" style="flex: 1; min-height: 32px; width: 100%; margin: 30px 4px 8px; object-fit: contain; opacity: 0.6;">
              <span style="font: 900 22px/26px var(--font-display);">Auburn</span>
              <span aria-hidden="true" style="display: block; width: 70%; height: 6px; border-radius: 999px; background: #0C2340; opacity: 0.5;"></span>
              <span style="font: 700 13px/18px var(--font-sans); opacity: 0.7;">7–4</span>
            </button>
            <div style="width: 24px; flex-shrink: 0; align-self: center; text-align: center; font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground);">at</div>
            <button type="button" aria-pressed="true" style="position: relative; flex: 1; min-width: 0; min-height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; box-sizing: border-box; padding: 12px 10px; border: 2px solid var(--primary); border-radius: 14px; background: var(--primary); color: var(--primary-foreground); cursor: pointer;">
              <span style="position: absolute; top: 10px; left: 10px; padding: 2px 8px; border-radius: 999px; background: var(--primary-foreground); color: var(--primary); font: 900 16px/20px var(--font-display);">#9</span>
              <span style="position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 999px; background: var(--primary-foreground); color: var(--primary);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
              <img src="/_blob/9edb2c9df62e014993aebbc8fd77ef6d" alt="" style="flex: 1; min-height: 32px; width: 100%; margin: 30px 4px 8px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));">
              <span style="font: 900 22px/26px var(--font-display);">Alabama</span>
              <span aria-hidden="true" style="display: block; width: 70%; height: 6px; border-radius: 999px; background: #9E1B32; box-shadow: 0 0 0 2px var(--primary-foreground);"></span>
              <span style="font: 700 13px/18px var(--font-sans);">9–2</span>
            </button>
          </div>

          <div style="min-height: 44px; display: flex; align-items: center; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Saved. Next game in a moment.</div>
        </div>

        <x-import component-from-global-scope="SaturdaySlateDesignSystem.BottomNav" tabs="{{p.tabs}}"></x-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1560,"height":868}}'>
var B_TOKENS = '--background: #f5e7d9; --card: #fbf2e8; --popover: #fbf2e8; --muted: #ecd9c7; --accent: #f0dfcf; --muted-foreground: #665748; --secondary: #9c4314; --border: #93745a; --input: #93745a; --settled: #f1e2d3;';
var LOOKS = [
  { key: 'today', label: 'Today · no Look', sub: 'What every other Week wears' },
  { key: 'A', label: 'A · The banner', sub: 'A rust band under every header; names as caps labels' },
  { key: 'B', label: 'B · The paper', sub: 'The Week swaps the paper tokens; names as pills' },
  { key: 'C', label: 'C · The program', sub: 'Laces across the top; rivalries billed in display type' }
];
var SAM = { flag: 'pine', pattern: 'sash', patternColor: 'gold', pole: 'tan', bg: 'auto' };

    { href: '#', label: 'Live Board', active: active === 'Live Board', icon: icon(h, [['path', { d: 'M4.9 19.1C1 15.2 1 8.8 4.9 4.9' }], ['path', { d: 'M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5' }], ['circle', { cx: 12, cy: 12, r: 2 }], ['path', { d: 'M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5' }], ['path', { d: 'M19.1 4.9C23 8.8 23 15.1 19.1 19' }]]) },
    { href: '#', label: 'Leaderboard', active: active === 'Leaderboard', icon: icon(h, [['path', { d: 'M6 9H4.5a2.5 2.5 0 0 1 0-5H6' }], ['path', { d: 'M18 9h1.5a2.5 2.5 0 0 0 0-5H18' }], ['path', { d: 'M4 22h16' }], ['path', { d: 'M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22' }], ['path', { d: 'M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22' }], ['path', { d: 'M18 2H6v7a6 6 0 0 0 12 0V2Z' }]]) },
    { href: '#', label: 'Chat', active: active === 'Chat', icon: icon(h, [['path', { d: 'M7.9 20A9 9 0 1 0 4 16.1L2 22Z' }]]) }
  ];
}
function phones(DS, h, active, extra) {
  var mark = DS.pennantDataUri ? { name: 'Sam', file: DS.pennantDataUri(SAM), color: DS.pennantTint(SAM), kind: 'flag' } : undefined;
  return LOOKS.map(function (l) {
    var p = {
      label: l.label, sub: l.sub,
      isA: l.key === 'A', isB: l.key === 'B', isC: l.key === 'C',
      band: l.key === 'A', laces: l.key === 'C',
      rootStyle: 'position: relative; width: 360px; height: 780px; overflow: hidden; transform: translateZ(0); display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: var(--font-sans); box-shadow: 0 0 0 1px rgba(36,31,26,.3); ' + (l.key === 'B' ? B_TOKENS : ''),
      menu: DS.MemberMenu ? h(DS.MemberMenu, { avatar: mark, displayName: 'Sam', group: 'Tailgate Twelve' }) : null,

}
class Component extends DCLogic {
  renderVals() {

      var done = i < 2;
      var cur = i === 1;
      segs.push({ style: 'display: block; height: 8px; border-radius: 999px; background: ' + (done ? 'var(--primary)' : 'var(--muted)') + ';' + (cur ? ' box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary);' : '') });
    }
    return { phones: phones(DS, h, 'Picks', function () { return { segs: segs }; }) };
  }
}
</script>
</body>
</html>
