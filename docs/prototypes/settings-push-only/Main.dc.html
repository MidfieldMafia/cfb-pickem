<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings, row in a card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/tokens.css">
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/components/bundle.css">
<script src="ds/saturdayslatedesignsystem/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--foreground)}a:hover{color:var(--primary)}
</style>
</helmet>
<div style="width: 390px; height: 1000px; display: flex; flex-direction: column; background: #e8e3d6; font-family: var(--font-sans); color: var(--foreground);">

  <div style="height: 156px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
    <label for="scenario" style="font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: #5c5246;">Prototype · Scenario</label>
    <select id="scenario" value="{{sc}}" onChange="{{pickScenario}}" style="height: 44px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--foreground); font: 500 14px/20px var(--font-sans); padding: 0 8px;">
      <sc-for list="{{scenarios}}" as="o" hint-placeholder-count="6">
        <option value="{{o.id}}">{{o.label}}</option>
      </sc-for>
    </select>
    <p style="margin: 0; font: 400 12px/16px var(--font-sans); color: #5c5246;">{{readout}}</p>
  </div>

  <div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); display: flex; flex-direction: column; gap: 16px;">
    <x-import component-from-global-scope="SaturdaySlateDesignSystem.AppHeader" title="Settings"></x-import>

    <section aria-labelledby="notifications-label" style="margin: 0 16px; display: flex; flex-direction: column; gap: 8px;">
    <h2 id="notifications-label" style="margin: 0; padding: 0 4px; font: 900 22px/28px var(--font-display); color: var(--foreground);">Notifications</h2>
    <x-import component-from-global-scope="SaturdaySlateDesignSystem.Card">
      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <p id="reminder-label" style="margin: 0; font: 700 16px/24px var(--font-sans);">Pick reminder</p>
            <sc-if value="{{calm}}" hint-placeholder-val="{{true}}">
              <p style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--muted-foreground);">The day before picks lock, if you&#8217;re not done.</p>
            </sc-if>
            <sc-if value="{{problem}}" hint-placeholder-val="{{false}}">
              <p style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--foreground);">{{problemText}}</p>
            </sc-if>
            <sc-if value="{{link}}" hint-placeholder-val="{{false}}">
              <a href="/install" style="display: inline-flex; align-items: center; min-height: 44px; margin: -8px 0 -12px; font: 600 14px/20px var(--font-sans); text-decoration: underline; text-underline-offset: 3px;">Add it to your Home Screen</a>
            </sc-if>
          </div>

          <sc-if value="{{swOn}}" hint-placeholder-val="{{false}}">
            <button type="button" role="switch" aria-checked="true" aria-labelledby="reminder-label" onClick="{{toggle}}" style="flex-shrink: 0; width: 52px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;">
              <span style="position: relative; display: block; width: 48px; height: 28px; box-sizing: border-box; border-radius: 999px; background: var(--primary);">
                <span style="position: absolute; top: 3px; left: 23px; width: 22px; height: 22px; border-radius: 999px; background: var(--primary-foreground);"></span>
              </span>
            </button>
          </sc-if>
          <sc-if value="{{swOff}}" hint-placeholder-val="{{true}}">
            <button type="button" role="switch" aria-checked="false" aria-labelledby="reminder-label" onClick="{{toggle}}" style="flex-shrink: 0; width: 52px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;">
              <span style="position: relative; display: block; width: 48px; height: 28px; box-sizing: border-box; border: 2px solid var(--muted-foreground); border-radius: 999px; background: var(--muted);">
                <span style="position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: var(--muted-foreground);"></span>
              </span>
            </button>
          </sc-if>
          <sc-if value="{{swDim}}" hint-placeholder-val="{{false}}">
            <button type="button" role="switch" aria-checked="false" aria-labelledby="reminder-label" disabled="{{yes}}" style="flex-shrink: 0; width: 52px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; opacity: 0.5;">
              <span style="position: relative; display: block; width: 48px; height: 28px; box-sizing: border-box; border: 2px solid var(--muted-foreground); border-radius: 999px; background: var(--muted);">
                <span style="position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: var(--muted-foreground);"></span>
              </span>
            </button>
          </sc-if>
        </div>
      </div>
    </x-import>
    </section>

    <sc-if value="{{prompt}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center;">
        <div role="alertdialog" aria-label="iPhone permission prompt" style="width: 270px; border-radius: 14px; background: rgba(242, 242, 247, 0.98); font-family: -apple-system, system-ui, sans-serif; color: #000; text-align: center; overflow: hidden;">
          <div style="padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 4px;">
            <p style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;">&#8220;Saturday Slate&#8221; Would Like to Send You Notifications</p>
            <p style="margin: 0; font-size: 13px; line-height: 18px;">Notifications may include alerts, sounds, and icon badges. These can be configured in Settings.</p>
          </div>
          <div style="display: flex; border-top: 0.5px solid rgba(60, 60, 67, 0.36);">
            <button type="button" onClick="{{dontAllow}}" style="flex: 1 1 0; height: 44px; border: 0; border-right: 0.5px solid rgba(60, 60, 67, 0.36); background: transparent; color: #007aff; font-size: 17px; font-family: inherit;">Don&#8217;t Allow</button>
            <button type="button" onClick="{{allow}}" style="flex: 1 1 0; height: 44px; border: 0; background: transparent; color: #007aff; font-size: 17px; font-weight: 600; font-family: inherit;">Allow</button>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh('app');
  }
  scenarioList() {
    return [
      { id: 'app', label: 'Home Screen app, reminder off', device: 'app', on: false, perm: 'not asked' },
      { id: 'appOn', label: 'Home Screen app, reminder on', device: 'app', on: true, perm: 'allowed' },
      { id: 'safari', label: 'Safari on iPhone (not on Home Screen)', device: 'safari', on: false, perm: 'n/a' },
      { id: 'computer', label: 'On a computer', device: 'computer', on: false, perm: 'n/a' },
      { id: 'denied', label: 'Notifications blocked in iPhone Settings', device: 'app', on: false, perm: 'denied' },
      { id: 'fell', label: 'Push stopped reaching the phone', device: 'app', on: false, perm: 'allowed', fell: true }
    ];
  }
  fresh(id) {
    const s = this.scenarioList().find((x) => x.id === id);
    return { sc: id, on: s.on, perm: s.perm, prompt: false, fell: !!s.fell };
  }
  renderVals() {
    const st = this.state;
    const s = this.scenarioList().find((x) => x.id === st.sc);
    const can = s.device === 'app' && st.perm !== 'denied';
    const toggle = () => {
      if (st.on) this.setState({ on: false, fell: false });
      else if (!can) this.forceUpdate();
      else if (st.perm === 'allowed') this.setState({ on: true, fell: false });
      else this.setState({ prompt: true });
    };

    let problemText = '';
    if (s.device === 'safari') problemText = 'Works from the Home Screen app.';
    else if (s.device === 'computer') problemText = 'Turn this on in the app on your phone.';
    else if (st.perm === 'denied') problemText = 'Blocked in iPhone Settings › Notifications.';
    else if (st.fell) problemText = 'Stopped reaching your phone, so it turned off.';

    const subs = st.on ? 1 : 0;
    return {
      yes: true,
      sc: st.sc,
      scenarios: this.scenarioList(),
      pickScenario: (e) => this.setState(this.fresh(e.target.value)),
      toggle,
      swOn: st.on,
      swOff: !st.on && can,
      swDim: !st.on && !can,
      calm: !problemText,
      problem: !!problemText,
      problemText,
      link: s.device === 'safari',
      prompt: st.prompt,
      allow: () => this.setState({ prompt: false, perm: 'allowed', on: true, fell: false }),
      dontAllow: () => this.setState({ prompt: false, perm: 'denied' }),
      readout: 'Saved: Pick reminder = ' + (st.on ? 'Push' : 'Off') + ' · This device’s permission: ' + st.perm + ' · Push subscriptions: ' + subs
    };
  }
}
</script>
</body>
</html>
