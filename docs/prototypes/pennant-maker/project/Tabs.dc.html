<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennant maker B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;900&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#1F4034}a:hover{color:#241F1A}
</style>
</helmet>
<div style="width: 360px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F1E3; color: #241F1A; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

<sc-if value="{{onFlags}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6152">Pick your pennant</p>
<div style="display: flex; align-items: center; gap: 4px">
<button aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-weight: 600; font-size: 16px">Flags</span>
</div>
<sc-if value="{{hasSaved}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6F6152"><dc-import name="Pennant" p="{{savedP}}" size="{{ 28 }}" hint-size="28px,28px"></dc-import>Yours: <strong style="color: #241F1A">{{savedName}}</strong></p>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button onClick="{{makeOwn}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; border: 1px solid transparent; border-radius: 12px; background: transparent">
<span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #9C845F; display: flex; align-items: center; justify-content: center; color: #1F4034"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 11px; line-height: 1.2; font-weight: 700">Make your own</span>
</button>
<sc-for list="{{tiles}}" as="item" hint-placeholder-count="12">
<button onClick="{{item.open}}" aria-pressed="{{item.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; border: 1px solid {{item.border}}; border-radius: 12px; background: {{item.cellBg}}">
<dc-import name="Pennant" p="{{item.p}}" size="{{ 64 }}" hint-size="64px,64px"></dc-import>
<span style="font-size: 11px; line-height: 1.2">{{item.name}}</span>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #6F6152">Tap a flag to open it in the maker. Save it as it is, or change it first.</p>
</div>
</sc-if>

<sc-if value="{{onEdit}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
<div style="padding: 8px 16px 0; display: flex; align-items: center; gap: 4px">
<button onClick="{{back}}" aria-label="Back to Flags" style="width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-weight: 600; font-size: 16px">{{title}}</span>
<span style="margin-left: auto; font-size: 12px; color: #6F6152">{{status}}</span>
</div>

<div style="margin: 4px 16px 0; display: flex; gap: 12px; align-items: center">
<dc-import name="Pennant" p="{{pv}}" size="{{ 80 }}" hint-size="80px,80px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: #FBF6EC; border: 1px solid #C6B49A">
<span style="width: 14px; font-family: Chivo, sans-serif; font-weight: 900; font-size: 14px">2</span>
<dc-import name="Pennant" p="{{pv}}" size="{{ 28 }}" hint-size="28px,28px"></dc-import>
<span style="font-weight: 700; font-size: 14px">You</span>
<span style="margin-left: auto; font-family: Chivo, sans-serif; font-weight: 900; font-size: 14px">41</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 6px">
<dc-import name="Pennant" p="{{pv}}" size="{{ 28 }}" hint-size="28px,28px"></dc-import>
<span style="padding: 6px 10px; border-radius: 12px 12px 12px 4px; background: #EAE0CC; font-size: 13px">Lock of the Week is in.</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding-left: 34px">
<span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 999px; border: 1px solid #C6B49A; background: #FBF6EC; font-size: 12px"><dc-import name="Pennant" p="{{pv}}" size="{{ 20 }}" hint-size="20px,20px"></dc-import>You</span>
</div>
</div>
</div>

<div role="tablist" aria-label="Pennant settings" style="margin-top: 14px; padding: 0 16px; display: flex; gap: 6px; overflow-x: auto">
<sc-for list="{{tabs}}" as="item" hint-placeholder-count="5">
<button role="tab" aria-selected="{{item.on}}" onClick="{{item.pick}}" style="flex-shrink: 0; height: 40px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid {{item.border}}; background: {{item.bg}}; color: {{item.fg}}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
<span style="width: 18px; height: 18px; border-radius: 50%; background: {{item.dot}}; box-shadow: inset 0 0 0 1px rgba(36,31,26,0.25)"></span>{{item.label}}
</button>
</sc-for>
</div>

<div role="tabpanel" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 6px">
<sc-for list="{{options}}" as="item" hint-placeholder-count="14">
<button onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border-radius: 12px; border: 1px solid {{item.border}}; background: {{item.cellBg}}">
<sc-if value="{{item.isPennant}}" hint-placeholder-val="{{ false }}">
<dc-import name="Pennant" p="{{item.p}}" size="{{ 52 }}" hint-size="52px,52px"></dc-import>
</sc-if>
<sc-if value="{{item.isSwatch}}" hint-placeholder-val="{{ true }}">
<span style="width: 44px; height: 44px; margin: 4px; border-radius: 50%; background: {{item.hex}}; box-shadow: inset 0 0 0 1px rgba(36,31,26,0.22)"></span>
</sc-if>
<span style="font-size: 11px; line-height: 1.2">{{item.name}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{showClash}}" hint-placeholder-val="{{ false }}">
<p style="margin: 10px 0 0; font-size: 13px; color: #8E2B20">Same as the flag, so the pattern won’t show.</p>
</sc-if>
</div>

<div style="padding: 12px 16px 16px; border-top: 1px solid #C6B49A; background: #F7F1E3">
<button onClick="{{save}}" style="width: 100%; height: 48px; border: 0; border-radius: 10px; background: #1F4034; color: #FBF6EC; font-weight: 700; font-size: 15px">Save pennant</button>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":760}}'>
const LIGHT = '#FBF6EC';
const DARK = '#241E19';
const PAL = [
  { id: 'moss', name: 'Moss', hex: '#6A9449' }, { id: 'sage', name: 'Sage', hex: '#5C9A74' },
  { id: 'pine', name: 'Pine', hex: '#1F4034' }, { id: 'teal', name: 'Teal', hex: '#1E6F73' },
  { id: 'slate', name: 'Slate', hex: '#2B4A5E' }, { id: 'plum', name: 'Plum', hex: '#4A2B45' },
  { id: 'maroon', name: 'Maroon', hex: '#75222C' }, { id: 'oxblood', name: 'Oxblood', hex: '#5E1F1A' },
  { id: 'copper', name: 'Copper', hex: '#D2712E' }, { id: 'gold', name: 'Gold', hex: '#B08D2E' },
  { id: 'tan', name: 'Tan', hex: '#9C845F' }, { id: 'stone', name: 'Stone', hex: '#6F6152' },
  { id: 'ink', name: 'Ink', hex: '#241F1A' }, { id: 'cream', name: 'Cream', hex: '#FBF6EC' }
];
const POLES = ['ink', 'stone', 'tan', 'gold', 'cream'];
const PATTERNS = [
  { id: 'dot', name: 'Dot', d: 'M22 30a5 5 0 1 0 10 0a5 5 0 1 0 -10 0Z' },
  { id: 'bars', name: 'Bars', d: 'M16 18 L30 22 L30 26 L16 22 Z M16 34 L30 30 L30 34 L16 38 Z' },
  { id: 'chevrons', name: 'Chevrons', d: 'M16 13 L26 17 L16 21 Z M16 22 L26 26 L16 30 Z M16 31 L26 35 L16 39 Z' },
  { id: 'block', name: 'Block', d: 'M30 20 L30 40 L42 34 L42 26 Z' },
  { id: 'bands', name: 'Twin Bands', d: 'M21 14.9 L25 16.4 L25 39.6 L21 41.1 Z M29 17.9 L33 19.4 L33 36.6 L29 38.1 Z' },
  { id: 'tip', name: 'Tip', d: 'M40 23 L54 28 L40 33 Z' },
  { id: 'diamond', name: 'Diamond', d: 'M28 22 L34 28 L28 34 L22 28 Z' },
  { id: 'sash', name: 'Sash', d: 'M16 30 L16 43 L50 30 Z' },
  { id: 'cross', name: 'Cross', d: 'M25.5 20 L28.5 20 L28.5 26.5 L35 26.5 L35 29.5 L28.5 29.5 L28.5 36 L25.5 36 L25.5 29.5 L19 29.5 L19 26.5 L25.5 26.5 Z' },
  { id: 'pips', name: 'Pips', d: 'M20 28a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z M28 28a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z M36 28a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z' },
  { id: 'rails', name: 'Rails', d: 'M16 24 L45.3 24 L50.7 26 L16 26 Z M16 30 L50.7 30 L45.3 32 L16 32 Z' },
  { id: 'chevron', name: 'Chevron', d: 'M24 18 L34 28 L24 38 L20 38 L30 28 L20 18 Z' },
  { id: 'plain', name: 'Plain', d: '' },
  { id: 'hoist', name: 'Hoist', d: 'M16 13 L24 16 L24 40 L16 43 Z' },
  { id: 'tricolour', name: 'Tricolour', d: 'M16 13 L42.7 23 L16 23 Z M16 33 L42.7 33 L16 43 Z' },
  { id: 'star', name: 'Star', d: 'M29.0 21.5 L30.6 25.8 L35.2 26.0 L31.6 28.8 L32.8 33.3 L29.0 30.7 L25.2 33.3 L26.4 28.8 L22.8 26.0 L27.4 25.8 Z' },
  { id: 'ring', name: 'Ring', d: 'M22 28a6 6 0 1 0 12 0a6 6 0 1 0 -12 0Z M25 28a3 3 0 1 1 6 0a3 3 0 1 1 -6 0Z' }
];
const PRESETS = [
  ['moss-dot', 'Moss Dot', 'moss', 'dot', 'ink'], ['oxblood-bars', 'Oxblood Bars', 'oxblood', 'bars', 'cream'],
  ['maroon-chevrons', 'Maroon Chevrons', 'maroon', 'chevrons', 'cream'], ['ink-block', 'Ink Block', 'ink', 'block', 'tan'],
  ['sage-bands', 'Sage Twin Bands', 'sage', 'bands', 'cream'], ['copper-tip', 'Copper Tip', 'copper', 'tip', 'cream'],
  ['gold-diamond', 'Gold Diamond', 'gold', 'diamond', 'cream'], ['pine-sash', 'Pine Sash', 'pine', 'sash', 'cream'],
  ['slate-cross', 'Slate Cross', 'slate', 'cross', 'cream'], ['stone-pips', 'Stone Pips', 'stone', 'pips', 'cream'],
  ['teal-rails', 'Teal Rails', 'teal', 'rails', 'cream'], ['plum-chevron', 'Plum Chevron', 'plum', 'chevron', 'cream']
].map(([id, name, flag, pattern, mark]) => ({ id, name, design: { flag, pattern, mark, pole: 'ink', bg: 'auto' } }));
const BLANK = { flag: 'pine', pattern: 'plain', mark: 'cream', pole: 'ink', bg: 'auto' };

function color(id) { return PAL.find((c) => c.id === id); }
function pattern(id) { return PATTERNS.find((p) => p.id === id); }
function mix(h, base, t) {
  const a = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const b = [1, 3, 5].map((i) => parseInt(base.slice(i, i + 2), 16));
  return '#' + a.map((v, i) => Math.round(v * t + b[i] * (1 - t)).toString(16).padStart(2, '0')).join('');
}
function spec(d, card, patternId) {
  const flag = color(d.flag).hex;
  return {
    bg: mix(d.bg === 'auto' ? flag : color(d.bg).hex, card, 0.18),
    flag: flag,
    pole: color(d.pole).hex,
    d: pattern(patternId || d.pattern).d,
    mark: color(d.mark).hex
  };
}
function same(a, b) { return ['flag', 'pattern', 'mark', 'pole', 'bg'].every((k) => a[k] === b[k]); }

class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({ screen: 'flags', tab: 'flag', design: BLANK, from: null, saved: null }, this.state);
    const d = s.design;
    const set = (key, val) => this.setState({ design: Object.assign({}, d, { [key]: val }) });
    const fromPreset = s.from ? PRESETS.find((p) => p.id === s.from) : null;
    const unchanged = fromPreset ? same(d, fromPreset.design) : false;
    const savedId = s.saved ? (s.saved.from || 'custom') : null;
    const cell = (on) => ({ border: on ? '#1F4034' : 'transparent', cellBg: on ? '#EFE7D5' : 'transparent', pressed: on });

    const tiles = [];
    if (s.saved && !s.saved.from) {
      tiles.push(Object.assign({ name: 'Yours', p: spec(s.saved.design, LIGHT), open: () => this.setState({ screen: 'edit', tab: 'flag', design: s.saved.design, from: null }) }, cell(true)));
    }
    PRESETS.forEach((pr) => tiles.push(Object.assign({ name: pr.name, p: spec(pr.design, LIGHT), open: () => this.setState({ screen: 'edit', tab: 'flag', design: pr.design, from: pr.id }) }, cell(savedId === pr.id))));

    const pv = spec(d, LIGHT);
    const TABS = [
      { id: 'flag', label: 'Flag', dot: pv.flag },
      { id: 'pattern', label: 'Pattern', dot: pv.flag },
      { id: 'mark', label: 'Pattern colour', dot: pv.mark },
      { id: 'pole', label: 'Pole', dot: pv.pole },
      { id: 'bg', label: 'Background', dot: pv.bg }
    ];
    const tabs = TABS.map((t) => {
      const on = s.tab === t.id;
      return { label: t.label, dot: t.dot, on: on, pick: () => this.setState({ tab: t.id }), border: on ? '#1F4034' : '#C6B49A', bg: on ? '#1F4034' : '#FBF6EC', fg: on ? '#FBF6EC' : '#241F1A' };
    });

    const colourOpts = (ids, key) => ids.map((id) => {
      const c = color(id);
      return Object.assign({ name: c.name, hex: c.hex, isSwatch: true, isPennant: false, pick: () => set(key, id) }, cell(d[key] === id));
    });
    let options;
    if (s.tab === 'pattern') {
      options = PATTERNS.map((pt) => Object.assign({ name: pt.name, p: spec(d, LIGHT, pt.id), isSwatch: false, isPennant: true, pick: () => set('pattern', pt.id) }, cell(d.pattern === pt.id)));
    } else if (s.tab === 'pole') {
      options = colourOpts(POLES, 'pole');
    } else if (s.tab === 'bg') {
      options = [Object.assign({ name: 'Match flag', hex: mix(color(d.flag).hex, LIGHT, 0.18), isSwatch: true, isPennant: false, pick: () => set('bg', 'auto') }, cell(d.bg === 'auto'))]
        .concat(PAL.map((c) => Object.assign({ name: c.name, hex: mix(c.hex, LIGHT, 0.18), isSwatch: true, isPennant: false, pick: () => set('bg', c.id) }, cell(d.bg === c.id))));
    } else {
      options = colourOpts(PAL.map((c) => c.id), s.tab);
    }

    return {
      onFlags: s.screen === 'flags',
      onEdit: s.screen === 'edit',
      hasSaved: !!s.saved,
      savedP: s.saved ? spec(s.saved.design, LIGHT) : spec(BLANK, LIGHT),
      savedName: s.saved ? (s.saved.from ? PRESETS.find((p) => p.id === s.saved.from).name : 'Your own') : '',
      tiles: tiles,
      makeOwn: () => this.setState({ screen: 'edit', tab: 'flag', design: BLANK, from: null }),
      back: () => this.setState({ screen: 'flags' }),
      save: () => this.setState({ screen: 'flags', saved: { design: d, from: unchanged ? s.from : null } }),
      title: fromPreset ? fromPreset.name : 'Make your own',
      status: fromPreset ? (unchanged ? 'Preset' : 'Edited') : 'New',
      pv: pv,
      tabs: tabs,
      options: options,
      showClash: (s.tab === 'mark' || s.tab === 'flag' || s.tab === 'pattern') && d.mark === d.flag && d.pattern !== 'plain'
    };
  }
}
</script>
</body>
</html>
