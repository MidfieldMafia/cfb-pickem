<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@900&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F1E3; color: #241F1A; font-family: Manrope, sans-serif; font-size: 16px; line-height: 24px;">
<div style="height: 56px; padding: 0 8px; display: flex; align-items: center;">
<a href="You.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; font-weight: 600; color: #241F1A; text-decoration: none;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg><span>You</span></a>
</div>
<div style="padding: 0 16px 32px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-family: Chivo, sans-serif; font-weight: 900; font-size: 28px; line-height: 32px;">Send feedback</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #6F6152;">Something broken, or an idea for the app?</p>
</div>

<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="background: #FBF6EC; border: 1px solid #9C845F; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="display: inline-flex; color: #1F4034;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg></span>
<p role="status" style="margin: 0; font-weight: 700; font-size: 18px; line-height: 24px;">Thanks, sent to the commissioners.</p>
</div>
<div style="display: flex; gap: 16px;">
<button type="button" onClick="{{again}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #241F1A; text-decoration: underline; text-underline-offset: 4px; cursor: pointer;">Send another</button>
<a href="You.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600; color: #241F1A; text-decoration: underline; text-underline-offset: 4px;">Back to You</a>
</div>
</div>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<form style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A94B17;">What is it?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 14px; border: {{bugBorder}}; background: {{bugBg}}; cursor: pointer;">
<input type="radio" name="kind" value="bug" checked="{{isBug}}" onChange="{{pickBug}}" style="margin: 4px 0 0; width: 18px; height: 18px; min-height: 0; accent-color: #1F4034;">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.88 1.88"></path><path d="M14.12 3.88 16 2"></path><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"></path><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"></path><path d="M12 20v-9"></path><path d="M6.53 9C4.6 8.8 3 7.1 3 5"></path><path d="M6 13H2"></path><path d="M3 21c0-2.1 1.7-3.9 3.8-4"></path><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"></path><path d="M22 13h-4"></path><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"></path></svg>Bug</span>
<span style="font-size: 14px; line-height: 20px; color: #6F6152;">Something's broken</span>
</span>
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 14px; border: {{ideaBorder}}; background: {{ideaBg}}; cursor: pointer;">
<input type="radio" name="kind" value="idea" checked="{{isIdea}}" onChange="{{pickIdea}}" style="margin: 4px 0 0; width: 18px; height: 18px; min-height: 0; accent-color: #1F4034;">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>Idea</span>
<span style="font-size: 14px; line-height: 20px; color: #6F6152;">Something you'd like</span>
</span>
</label>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="text" style="font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A94B17;">In your words</label>
<textarea id="text" maxlength="1000" rows="6" placeholder="{{placeholder}}" value="{{text}}" onInput="{{type}}" style="box-sizing: border-box; width: 100%; min-height: 148px; padding: 10px 12px; border: 1px solid #9C845F; border-radius: 6px; background: transparent; font: inherit; font-size: 16px; line-height: 24px; color: #241F1A; resize: vertical;"></textarea>
<p style="margin: 0; align-self: flex-end; font-size: 12px; line-height: 16px; color: #6F6152;">{{count}} / 1000</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A94B17;">Screenshot <span style="font-weight: 600; text-transform: none; letter-spacing: 0; color: #6F6152;">(optional)</span></p>
<sc-if value="{{noShot}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{attach}}" style="align-self: flex-start; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid #9C845F; border-radius: 6px; background: #F7F1E3; color: #241F1A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>Add a screenshot</button>
</sc-if>
<sc-if value="{{hasShot}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px;">
<img src="/_blob/1d913b7c2fc205c574dce5679912361c" alt="Your screenshot" style="width: 48px; height: 104px; object-fit: cover; border-radius: 6px; border: 1px solid #9C845F;">
<div style="display: flex; flex-direction: column;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">Screenshot added</span>
<button type="button" onClick="{{detach}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #241F1A; text-decoration: underline; text-underline-offset: 4px; cursor: pointer;">Remove</button>
</div>
</div>
</sc-if>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: #8E2B20;">{{error}}</p>
</sc-if>
<button type="button" onClick="{{send}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 24px; width: 100%; border: 0; border-radius: 6px; background: #1F4034; color: #FBF6EC; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Send</button>
</div>
</form>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["empty","filled","sent","capped"],"default":"empty"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const start = props.start || 'empty';
    const filled = start !== 'empty';
    this.state = {
      kind: filled ? 'bug' : null,
      text: filled ? "The board froze on the 3:30 games and didn't catch up until I pulled down to refresh." : '',
      shot: filled,
      sent: start === 'sent',
      error: start === 'capped' ? "You've sent 10 today, the most in a day. Try again tomorrow." : '',
    };
  }
  renderVals() {
    const s = this.state;
    const on = '2px solid #1F4034', off = '1px solid #9C845F';
    const onBg = '#EFE7D5', offBg = '#FBF6EC';
    return {
      sent: s.sent,
      editing: !s.sent,
      isBug: s.kind === 'bug',
      isIdea: s.kind === 'idea',
      bugBorder: s.kind === 'bug' ? on : off,
      ideaBorder: s.kind === 'idea' ? on : off,
      bugBg: s.kind === 'bug' ? onBg : offBg,
      ideaBg: s.kind === 'idea' ? onBg : offBg,
      placeholder: s.kind === 'idea' ? 'What would you like the app to do?' : 'What happened, and what did you expect?',
      text: s.text,
      count: s.text.length,
      noShot: !s.shot,
      hasShot: s.shot,
      hasError: !!s.error,
      error: s.error,
      pickBug: () => this.setState({ kind: 'bug', error: '' }),
      pickIdea: () => this.setState({ kind: 'idea', error: '' }),
      type: (e) => this.setState({ text: e.target.value.slice(0, 1000), error: '' }),
      attach: () => this.setState({ shot: true }),
      detach: () => this.setState({ shot: false }),
      send: () => {
        if (!s.kind || !s.text.trim()) {
          this.setState({ error: 'Choose Bug or Idea, and say a few words.' });
          return;
        }
        this.setState({ sent: true, error: '' });
      },
      again: () => this.setState({ kind: null, text: '', shot: false, sent: false, error: '' }),
    };
  }
}
</script>
</body>
</html>
