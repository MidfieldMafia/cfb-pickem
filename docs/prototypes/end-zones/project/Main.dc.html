<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Names face the field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@900&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 1840px; box-sizing: border-box; padding: 24px 16px; background: #F7F1E3; font-family: Manrope, sans-serif; color: #241F1A; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: Chivo, sans-serif; font-weight: 900; font-size: 22px; line-height: 28px">A · Names face the field</h1>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #6F6152">Each name reads toward midfield, like end zone paint. A turnover gets a callout under the spot where the ball changed hands, in the colours of the team that got it.</p>
</div>
<sc-for list="{{scenarios}}" as="it" hint-placeholder-count="10">
<div style="background: #FBF6EC; border: 1px solid #D26A12; border-radius: 10px; padding: 10px">
<dc-import name="Field" scenario="{{it.id}}" variant="A" rule="{{rule}}" name-size="{{nameSize}}" flash="{{flash}}" hint-size="336px,134px"></dc-import>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rule&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bar&quot;,&quot;turf&quot;,&quot;primary&quot;],&quot;default&quot;:&quot;primary&quot;},&quot;nameSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:9,&quot;max&quot;:16,&quot;default&quot;:14},&quot;flash&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;orange&quot;,&quot;chalk&quot;],&quot;default&quot;:&quot;orange&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1840}}">
class Component extends DCLogic {
  renderVals() {
    return {
      rule: this.props.rule ?? 'primary',
      nameSize: this.props.nameSize ?? 14,
      flash: this.props.flash ?? 'orange',
      scenarios: ['rest-1', 'rest-2', 'rest-3', 'rest-4', 'int', 'fum', 'downs', 'block', 'td', 'pick6'].map((id) => ({ id }))
    };
  }
}
</script>
</body>
</html>
