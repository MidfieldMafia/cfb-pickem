<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nudge B: compact banner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/tokens.css">
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/components/bundle.css">
<script src="ds/saturdayslatedesignsystem/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--foreground)}a:hover{color:var(--primary)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); font-family: var(--font-sans); color: var(--foreground); display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 4px;">
    <img src="/_blob/9577a35e2101ba408ada06b69facffb3" alt="" width="44" height="44">
    <div style="min-width: 0; flex: 1;">
      <h1 style="margin: 0; font: 900 22px/28px var(--font-display);">Week 8</h1>
      <div style="font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Game 1 of 8</div>
    </div>
    <x-import component-from-global-scope="SaturdaySlateDesignSystem.HeaderLinks"></x-import>
    <x-import component-from-global-scope="SaturdaySlateDesignSystem.Badge" variant="pending">Pending</x-import>
  </header>

  <sc-if value="{{showNudge}}" hint-placeholder-val="{{true}}">
    <div style="padding: 4px 16px 0;">
      <section aria-label="Home Screen" style="display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--card);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--primary); flex-shrink: 0;"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
        <div style="flex: 1; min-width: 0; display: grid;">
          <span style="font: 700 14px/18px var(--font-sans);">Get your Pick reminder as a notification</span>
          <span style="font-size: 13px; line-height: 18px; color: var(--muted-foreground);">Put Saturday Slate on your Home Screen.</span>
        </div>
        <x-import component-from-global-scope="SaturdaySlateDesignSystem.Button" on-click="{{install}}" style="height: 44px; flex-shrink: 0;">Add</x-import>
        <button type="button" aria-label="Not now" onClick="{{dismiss}}" style="width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted-foreground); cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </section>
    </div>
  </sc-if>

  <nav aria-label="Games" style="display: flex; align-items: center; gap: 4px; padding: 0 16px;">
    <sc-for list="{{segments}}" as="s" hint-placeholder-count="8">
      <span style="flex: 1; padding: 18px 0;"><span style="{{s.style}}"></span></span>
    </sc-for>
    <span style="width: 26px; display: grid; place-items: center; min-height: 44px;"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: 2px dashed var(--secondary);"></span></span>
    <span style="width: 26px; display: grid; place-items: center; min-height: 44px;"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: 2px dashed var(--secondary);"></span></span>
  </nav>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 12px; min-height: 0;">
    <div style="display: grid; font-size: 14px; line-height: 18px; color: var(--muted-foreground);">
      <span>Sat 11:00 AM · ABC</span>
      <span style="font-size: 12px;">Cotton Bowl · Dallas, TX</span>
    </div>

    <div style="display: grid; gap: 8px; padding: 6px 4px 10px;">
      <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 14px;">
        <span style="font-weight: 500; color: var(--muted-foreground);">OU +3.5</span>
        <span style="font: 700 10px/12px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary);">Spread</span>
        <span style="text-align: right; font-weight: 800;">TEX −3.5</span>
      </div>
      <span style="display: flex; gap: 3px; height: 6px; border-radius: 999px; overflow: hidden; background: var(--border);"><span style="flex: 1; background: #841617;"></span><span style="flex: 1; background: #BF5700;"></span></span>
    </div>

    <div style="flex: 1; display: flex; align-items: stretch; gap: 6px; min-height: 0;">
      <button type="button" style="flex: 1; min-width: 0; min-height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 12px 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--foreground); font-family: var(--font-sans);">
        <span style="flex: 1; align-self: stretch; margin: 30px 4px 8px; min-height: 32px; background: url(/_blob/e2ee0bff0f077078e0b081f0da6bb089) center / contain no-repeat;"></span>
        <span style="font: 900 22px/26px var(--font-display);">Oklahoma</span>
        <span style="display: block; width: 70%; height: 6px; border-radius: 999px; background: #841617;"></span>
      </button>
      <div style="width: 24px; align-self: center; text-align: center; font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground);">at</div>
      <button type="button" style="flex: 1; min-width: 0; min-height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 12px 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--foreground); font-family: var(--font-sans);">
        <span style="flex: 1; align-self: stretch; margin: 30px 4px 8px; min-height: 32px; background: url(/_blob/e36c1c010a98cb4ae78d40fbf4e06e68) center / contain no-repeat;"></span>
        <span style="font: 900 22px/26px var(--font-display);">Texas</span>
        <span style="display: block; width: 70%; height: 6px; border-radius: 999px; background: #BF5700;"></span>
      </button>
    </div>

    <div style="min-height: 44px; display: flex; align-items: center; padding-top: 4px; font-size: 14px; color: var(--muted-foreground);">Tap a team to pick it.</div>
  </div>

  <x-import component-from-global-scope="SaturdaySlateDesignSystem.BottomNav" tabs="{{tabs}}"></x-import>

  <sc-if value="{{dismissed}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{reset}}" style="position: absolute; left: 16px; right: 16px; top: 64px; height: 36px; border: 1px dashed #5c5246; border-radius: 6px; background: #e8e3d6; color: #3d362e; font: 600 13px/18px var(--font-sans); cursor: pointer;">Prototype: hidden for this visit. Tap to show again</button>
  </sc-if>
  <sc-if value="{{installed}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{reset}}" style="position: absolute; left: 16px; right: 16px; top: 64px; height: 36px; border: 1px dashed #5c5246; border-radius: 6px; background: #e8e3d6; color: #3d362e; font: 600 13px/18px var(--font-sans); cursor: pointer;">Prototype: this opens /install. Tap to come back</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'shown' };
  }
  icon(parts) {
    const h = window.React.createElement;
    return h('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true },
      parts.map((p, i) => h(p[0], Object.assign({ key: i }, p[1]))));
  }
  renderVals() {
    const mode = this.state.mode;
    const segments = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({
      style: 'display: block; height: 8px; border-radius: 999px; background: var(--muted);' + (i === 0 ? ' box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary);' : '')
    }));
    const tabs = [
      { href: '#', label: 'Picks', active: true, icon: this.icon([['rect', { x: 8, y: 2, width: 8, height: 4, rx: 1 }], ['path', { d: 'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2' }], ['path', { d: 'm9 14 2 2 4-4' }]]) },
      { href: '#', label: 'Live Board', active: false, icon: this.icon([['path', { d: 'M4.9 19.1C1 15.2 1 8.8 4.9 4.9' }], ['path', { d: 'M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5' }], ['circle', { cx: 12, cy: 12, r: 2 }], ['path', { d: 'M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5' }], ['path', { d: 'M19.1 4.9C23 8.8 23 15.1 19.1 19' }]]) },
      { href: '#', label: 'Leaderboard', active: false, icon: this.icon([['path', { d: 'M6 9H4.5a2.5 2.5 0 0 1 0-5H6' }], ['path', { d: 'M18 9h1.5a2.5 2.5 0 0 0 0-5H18' }], ['path', { d: 'M4 22h16' }], ['path', { d: 'M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22' }], ['path', { d: 'M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22' }], ['path', { d: 'M18 2H6v7a6 6 0 0 0 12 0V2Z' }]]) },
      { href: '#', label: 'Chat', active: false, icon: this.icon([['path', { d: 'M7.9 20A9 9 0 1 0 4 16.1L2 22Z' }]]) }
    ];
    return {
      showNudge: mode === 'shown',
      dismissed: mode === 'dismissed',
      installed: mode === 'installed',
      dismiss: () => this.setState({ mode: 'dismissed' }),
      install: () => this.setState({ mode: 'installed' }),
      reset: () => this.setState({ mode: 'shown' }),
      segments: segments,
      tabs: tabs
    };
  }
}
</script>
</body>
</html>
