<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Reacted in the tray</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F1E3}
</style>
</helmet>
<div style="width: 390px; height: 844px;">
<dc-import name="Main" gesture="tray" rowstyle="{{rowstyle}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rowstyle":{"editor":"enum","options":["rows","grouped","names"],"default":"rows"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rowstyle: this.props.rowstyle || 'rows' };
  }
}
</script>
</body>
</html>
