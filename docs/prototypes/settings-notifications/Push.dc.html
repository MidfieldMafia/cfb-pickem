<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Pick reminder push</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/saturdayslatedesignsystem/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 640px; box-sizing: border-box; padding: 32px 12px; background: #2b3a33; font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px;">

  <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0 4px; font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: #f2e9d8;">{{o.name}}</p>
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 22px; background: rgba(245, 245, 245, 0.92); color: #000;">
        <div aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 9px; background: var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
          <span style="font: 900 22px/22px var(--font-display); color: #f7f1e3;">S</span>
          <span style="width: 16px; height: 2px; background: var(--secondary);"></span>
        </div>
        <div style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto;">
          <div style="display: flex; justify-content: space-between; gap: 8px;">
            <span style="font-size: 15px; line-height: 20px; font-weight: 600;">{{o.title}}</span>
            <span style="font-size: 13px; line-height: 20px; color: rgba(60, 60, 67, 0.6); flex-shrink: 0;">now</span>
          </div>
          <span style="font-size: 15px; line-height: 20px;">{{o.body}}</span>
          <span style="font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6);">from Saturday Slate</span>
        </div>
      </div>
    </div>
  </sc-for>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid rgba(242, 233, 216, 0.4); border-radius: 14px; color: #f2e9d8;">
    <p style="margin: 0; font: 700 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase;">A tap opens</p>
    <p style="margin: 0; font: 400 14px/20px var(--font-sans);">Picks, in the Home Screen app, at the first thing still open: a game, else the Lock step, else the Tiebreaker Guess.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        { name: '1 · The text, split in two', title: 'Week 8 picks lock Sat 11 AM CT', body: 'Still need 2 picks, Lock.' },
        { name: '2 · What you still need first', title: 'Still need 2 picks, Lock', body: 'Week 8 picks lock Sat 11 AM CT.' }
      ]
    };
  }
}
</script>
</body>
</html>
