<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixed pool on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@900&amp;family=Manrope:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Manrope,sans-serif;color:#241F1A;background:#F7F1E3}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; padding: 16px; background: #F7F1E3; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px;">
<div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A94B17;">Prototype · {{treatmentLabel}}</div>
<h1 style="margin: 0; font-family: Chivo, sans-serif; font-weight: 900; font-size: 28px; line-height: 32px;">Leaderboard</h1>
</div>
<div style="background: #FBF6EC; border-radius: 14px; padding: 4px 12px;">
<div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 48px 56px; align-items: center; min-height: 36px; font-size: 12px; font-weight: 700; color: #6F6152; border-bottom: 1px solid #9C845F;">
<span>#</span><span>Member</span><span style="text-align: right;">Pts</span><span style="text-align: right;">W-L</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="{{r.rowStyle}}">
<span style="font-size: 14px; color: #6F6152; font-variant-numeric: tabular-nums;">{{r.rank}}</span>
<span style="display: flex; align-items: center; gap: 8px; min-width: 0;">
<dc-import name="Pennant" mark="{{r.mark}}" size="{{r.size}}" treatment="{{treatment}}" floor="{{floor}}" hint-size="28px,28px"></dc-import>
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.displayName}}</span>
<sc-if value="{{r.you}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #6F6152;">you</span></sc-if>
</span>
<span style="text-align: right; font-family: Chivo, sans-serif; font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums;">{{r.pts}}</span>
<span style="text-align: right; font-size: 14px; font-variant-numeric: tabular-nums;">{{r.record}}</span>
</div>
</sc-for>
</div>
<div style="background: #FBF6EC; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A94B17;">Live board · picked Georgia</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
<span style="{{c.chipStyle}}">
<dc-import name="Pennant" mark="{{c.mark}}" size="{{c.size}}" treatment="{{treatment}}" floor="{{floor}}" hint-size="20px,20px"></dc-import>
<span style="{{c.textStyle}}">{{c.label}}</span>
</span>
</sc-for>
</div>
</div>
<div style="background: #FBF6EC; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #A94B17;">
<div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A94B17; padding-bottom: 6px;">Tiebreaker Guesses</div>
<sc-for list="{{guesses}}" as="g" hint-placeholder-count="5">
<div style="{{g.rowStyle}}">
<dc-import name="Pennant" mark="{{g.mark}}" size="{{g.size}}" treatment="{{treatment}}" floor="{{floor}}" hint-size="20px,20px"></dc-import>
<span style="{{g.nameStyle}}">{{g.label}}</span>
<span style="font-family: Chivo, sans-serif; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums;">{{g.guess}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"treatment":{"editor":"enum","options":["bare","hairline","inset"],"default":"hairline","section":"Photo"},"floor":{"editor":"enum","options":["none","20","28"],"default":"none","section":"Photo"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var treatment = this.props.treatment || 'hairline';
    var floorKey = this.props.floor || 'none';
    var floor = floorKey === 'none' ? 0 : Number(floorKey);
    var F = {
      moss: { kind: 'flag', src: '/_blob/7221f6a19db8073d8826d2b7beb133f2', alt: 'Moss Dot', color: '#6A9449' },
      ink: { kind: 'flag', src: '/_blob/5bfe7c4184de00f99ba38ab0f596570a', alt: 'Ink Block', color: '#241F1A' },
      copper: { kind: 'flag', src: '/_blob/cc52b042f0daf71cb602b44f2d938770', alt: 'Copper Tip', color: '#D2712E' },
      teal: { kind: 'flag', src: '/_blob/b4be4234f65a8a93f51e797c48ebef56', alt: 'Teal Rails', color: '#1E6F73' },
      bama: { kind: 'logo', src: '/_blob/710b7544de7273b045c023d0fcbaf2ac', alt: 'Alabama', color: '#9E1B32' },
      mich: { kind: 'logo', src: '/_blob/6b9d7322db4e044416f32196ecc23b31', alt: 'Michigan', color: '#00274C' }
    };
    var P = {
      dale: { kind: 'photo', src: '/_blob/503d5448eb23abb55bf9fdeca418dcdb', alt: 'Dale', initial: 'D' },
      coach: { kind: 'photo', src: '/_blob/c131cb1411e50d00a53cbb4cc50b2b99', alt: 'Coach T', initial: 'C' },
      mike: { kind: 'photo', src: '/_blob/665df7505b3dd8ac8f6b51bf993a66ae', alt: 'Big Mike', initial: 'M' },
      kels: { kind: 'photo', src: '/_blob/8573b683f77fafb986d384bb0341559e', alt: 'Kels', initial: 'K' },
      priya: { kind: 'photo', src: '/_blob/2f5a81d7ed8131f7d6aaf59969ae9296', alt: 'Priya', initial: 'P' },
      dog: { kind: 'photo', src: '/_blob/df852c7dc8e80ebe6230c73b7fdb72d2', alt: 'Beth', initial: 'B' },
      ball: { kind: 'photo', src: '/_blob/f6c1467948df51496c3b99150d18a541', alt: 'Jen', initial: 'J' }
    };
    var members = [
      { n: 'Dale', m: P.dale, pts: 41, rec: '41-15' },
      { n: 'Marcus', m: F.copper, pts: 39, rec: '39-17' },
      { n: 'Priya', m: P.priya, pts: 38, rec: '38-18', you: true },
      { n: 'Tommy', m: F.bama, pts: 37, rec: '37-19' },
      { n: 'Jen', m: P.ball, pts: 36, rec: '36-20' },
      { n: 'Kels', m: P.kels, pts: 35, rec: '35-21' },
      { n: 'Ana', m: F.ink, pts: 34, rec: '34-22' },
      { n: 'Big Mike', m: P.mike, pts: 33, rec: '33-23' },
      { n: 'Sam', m: { kind: 'none', initial: 'S' }, pts: 31, rec: '31-25' },
      { n: 'Beth', m: P.dog, pts: 30, rec: '30-26' },
      { n: 'Wes', m: F.mich, pts: 29, rec: '29-27' },
      { n: 'Coach T', m: P.coach, pts: 27, rec: '27-29' },
      { n: 'Kirby', m: F.teal, pts: 26, rec: '26-30' },
      { n: 'Lou', m: F.moss, pts: 24, rec: '24-32' }
    ];
    var rowBase = 'display: grid; grid-template-columns: 32px minmax(0, 1fr) 48px 56px; align-items: center; min-height: 48px; border-bottom: 1px solid #C6B49A;';
    var rows = members.map(function (x, i) {
      return {
        rank: i + 1, mark: x.m, size: 28, displayName: x.n, you: !!x.you, pts: x.pts, record: x.rec,
        rowStyle: rowBase + (x.you ? ' background: #EAE0CC; margin: 0 -12px; padding: 0 12px;' : '')
      };
    });
    var picked = [members[2], members[0], members[1], members[9], members[3], members[7], members[8], members[11], members[12]];
    var chips = picked.map(function (x) {
      var you = !!x.you;
      return {
        mark: x.m, size: 20, label: you ? 'You' : x.n,
        chipStyle: 'display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; padding: 4px 10px 4px 4px; ' + (you ? 'background: #1F4034; color: #FBF6EC;' : 'background: #EAE0CC; color: #241F1A;'),
        textStyle: 'font-size: 12px; line-height: 16px; font-weight: ' + (you ? 800 : 600) + ';'
      };
    });
    var guessed = [
      { x: members[4], g: 51 }, { x: members[2], g: 52 }, { x: members[5], g: 47 }, { x: members[6], g: 58 }, { x: members[9], g: 44 }, { x: members[10], g: 61 }
    ];
    var guesses = guessed.map(function (o) {
      var you = !!o.x.you;
      return {
        mark: o.x.m, size: 20, label: you ? 'You' : o.x.n, guess: o.g,
        rowStyle: 'display: flex; align-items: center; gap: 8px; min-height: 32px; border-radius: 6px; padding: 0 6px;' + (you ? ' background: #EFE7D5;' : ''),
        nameStyle: 'flex-grow: 1; min-width: 0; font-size: 14px; font-weight: ' + (you ? 800 : 600) + ';'
      };
    });
    var labels = { bare: 'A · Bare', hairline: 'B · Hairline', inset: 'C · Inset ring' };
    return {
      treatment: treatment, floor: floor,
      treatmentLabel: labels[treatment] + (floor ? ' · initials at ' + floor + 'px and below' : ''),
      rows: rows, chips: chips, guesses: guesses
    };
  }
}
</script>
</body>
</html>
