<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennant picker — conference drill-down</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#F7F1E3;font-family:Manrope,ui-sans-serif,system-ui,sans-serif;color:#241F1A;-webkit-font-smoothing:antialiased}
a{color:#A94B17}a:hover{color:#8E3D12}
button{font-family:inherit}
input{font-family:inherit}
*{box-sizing:border-box}
.sb::-webkit-scrollbar{width:0;height:0}

</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F1E3; overflow: hidden;">
<div style="padding: 16px 16px 8px; flex-shrink: 0;">
<div style="font-family: Chivo, sans-serif; font-weight: 900; font-size: 28px; line-height: 32px; margin-bottom: 4px;">Welcome to the Slate</div>
<div style="font-size: 14px; line-height: 20px; color: #6F6152;">Two things and you are in: your name, and the mark that stands for you.</div>
</div>
<div style="padding: 0 16px 8px; flex-shrink: 0;">
<sc-if value="{{atRoot}}" hint-placeholder-val="{{yes}}">
<div style="font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A94B17;">Pick your pennant</div>
</sc-if>
<sc-if value="{{showBack}}" hint-placeholder-val="{{no}}">
<button type="button" onClick="{{back}}" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 0; border: none; background: transparent; color: #1F4034; font-size: 14px; font-weight: 700; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4034" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>{{backLabel}}</button>
<div style="font-family: Chivo, sans-serif; font-weight: 700; font-size: 22px; line-height: 28px;">{{headTitle}}</div>
</sc-if>
</div>
<div class="sb" style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px;">
<sc-if value="{{atRoot}}" hint-placeholder-val="{{yes}}">
<button type="button" onClick="{{openFlags}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 16px; margin-bottom: 12px; border-radius: 14px; border: 1px solid #9C845F44; background: #FBF6EC; cursor: pointer; text-align: left;">
<span style="display: flex; align-items: center; flex-shrink: 0;">
<sc-for list="{{flagPeek}}" as="p" hint-placeholder-count="4">
<span style="{{p.peekStyle}}"><img src="{{p.u}}" alt="" style="width: 50px; height: 50px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"></span>
</sc-for>
</span>
<span style="flex-grow: 1; min-width: 0;"><span style="display: block; font-family: Chivo, sans-serif; font-weight: 700; font-size: 18px;">Flags</span><span style="display: block; font-size: 13px; color: #6F6152; margin-top: 2px;">12 pennants</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
<button type="button" onClick="{{openConfs}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 16px; border-radius: 14px; border: 1px solid #9C845F44; background: #FBF6EC; cursor: pointer; text-align: left;">
<span style="display: flex; align-items: center; flex-shrink: 0;">
<sc-for list="{{teamPeek}}" as="p" hint-placeholder-count="4">
<span style="{{p.peekStyle}}"><img src="{{p.u}}" alt="" style="width: 26px; height: 26px; object-fit: contain;"></span>
</sc-for>
</span>
<span style="flex-grow: 1; min-width: 0;"><span style="display: block; font-family: Chivo, sans-serif; font-weight: 700; font-size: 18px;">Team Logos</span><span style="display: block; font-size: 13px; color: #6F6152; margin-top: 2px;">136 teams in 11 conferences</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</sc-if>
<sc-if value="{{isFlags}}" hint-placeholder-val="{{no}}">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{flagList}}" as="f" hint-placeholder-count="12">
<button type="button" onClick="{{f.pick}}" aria-label="{{f.n}}" style="{{f.style}}">
<img src="{{f.u}}" alt="" style="width: 90px; height: 90px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isConfs}}" hint-placeholder-val="{{no}}">
<sc-for list="{{confRows}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.open}}" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; border: 1px solid #9C845F44; background: #FBF6EC; cursor: pointer; text-align: left;">
<span style="flex-grow: 1; min-width: 0;"><span style="display: block; font-size: 16px; font-weight: 600;">{{c.name}}</span><span style="display: block; font-size: 12px; color: #6F6152;">{{c.count}} teams</span></span>
<span style="display: flex; align-items: center; flex-shrink: 0;">
<sc-for list="{{c.peek}}" as="p" hint-placeholder-count="3">
<img src="{{p.u}}" alt="" style="width: 26px; height: 26px; object-fit: contain; margin-left: -6px;">
</sc-for>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</sc-for>
</sc-if>
<sc-if value="{{inConf}}" hint-placeholder-val="{{no}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{confTeams}}" as="t" hint-placeholder-count="9">
<button type="button" onClick="{{t.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 14px; cursor: pointer; {{t.cell}}">
<span style="{{t.discStyle}}"><img src="{{t.u}}" alt="" style="width: 44px; height: 44px; object-fit: contain;"></span>
<span style="font-size: 12px; line-height: 16px; text-align: center; color: #241F1A;">{{t.n}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 16px; border-top: 1px solid #9C845F33; background: #F7F1E3;">
<button type="button" style="width: 100%; height: 44px; border: none; border-radius: 6px; background: #1F4034; color: #FBF6EC; font-size: 16px; font-weight: 700; cursor: pointer;">Save and start picking</button>
</div>
</div>
</x-dc>

      }),
